name: Terraform

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  s3-bucket-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch and Decode OIDC Token
        run: |
          # 1. Request the raw JWT token using internal environment variables
          JWT_TOKEN=$(curl -sLS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&aud=https://github.com" | jq -r '.value')
          
          # 2. Extract and decode the middle part (payload) of the JWT
          echo "--- Decoded OIDC Token Claims ---"
          echo "$JWT_TOKEN" | cut -d'.' -f2 | base64 --decode | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Debug OIDC token
        run: |
          echo "SUB: $ACTIONS_ID_TOKEN_REQUEST_SUBJECT"
          echo "AUD: $ACTIONS_ID_TOKEN_REQUEST_AUDIENCE"
          echo "ARN: ${{ secrets.AWS_ROLE_ARN }}"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve
