name: Deploy Next.js to ECS and package Python API

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-nextjs-production
  cancel-in-progress: false

jobs:
  package-python-api:
    name: Package Python API for Lambda
    runs-on: ubuntu-latest
    env:
      LAMBDA_ARTIFACT_BUCKET: ${{ vars.LAMBDA_ARTIFACT_BUCKET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate artifact bucket configuration
        run: |
          if [ -z "$LAMBDA_ARTIFACT_BUCKET" ]; then
            echo "Set the LAMBDA_ARTIFACT_BUCKET repository variable before running this workflow." >&2
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda package
        run: |
          set -euo pipefail
          mkdir package
          python -m pip install --requirement services/python-api/requirements.txt --target package
          cp services/python-api/sites.py package/
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=package python -c "from sites import handler"
          (cd package && zip -qr "$GITHUB_WORKSPACE/python-api.zip" .)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Upload Lambda package to S3
        run: |
          object_key="python-api/${GITHUB_SHA}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.zip"
          aws s3 cp python-api.zip "s3://${LAMBDA_ARTIFACT_BUCKET}/${object_key}" --region ap-southeast-2 --no-progress
          echo "Python API Lambda package: s3://${LAMBDA_ARTIFACT_BUCKET}/${object_key}" >> "$GITHUB_STEP_SUMMARY"

  terraform-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.15.9

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init

      - name: Create ECR repository
        working-directory: infra/terraform
        run: terraform apply -target=aws_ecr_repository.nextjs -auto-approve

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build --tag "$REGISTRY/simple-next:$IMAGE_TAG" .
          docker push "$REGISTRY/simple-next:$IMAGE_TAG"

      - name: Apply infrastructure and deploy
        env:
          IMAGE_TAG: ${{ github.run_id }}-${{ github.run_attempt }}
        working-directory: infra/terraform
        run: terraform apply -auto-approve -var="image_tag=$IMAGE_TAG"

      - name: Report application URL
        working-directory: infra/terraform
        run: |
          echo "Application URL: $(terraform output -raw app_url)" >> "$GITHUB_STEP_SUMMARY"
