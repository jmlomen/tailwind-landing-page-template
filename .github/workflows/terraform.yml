name: Terraform

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  s3-bucket-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.15.9
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Terraform Init
        working-directory: infra/terraform
        run: |
          terraform init
          terraform import aws_s3_bucket.tfstate tfstate-jmlomen-main
          terraform import aws_s3_bucket_versioning.tfstate_versioning tfstate-jmlomen-main
          terraform import aws_s3_bucket_server_side_encryption_configuration.tfstate_encryption tfstate-jmlomen-main
          terraform import aws_s3_bucket_public_access_block.tfstate_block tfstate-jmlomen-main

      - name: Terraform Apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve
